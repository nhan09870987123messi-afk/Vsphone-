<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Phone Roblox</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* ĐIỆN THOẠI */
.phone {
    width: 360px;
    height: 720px;
    background: #000;
    border: 8px solid #222;
    border-radius: 45px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 50px #000;
}

/* CAMERA */
.camera {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 25px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
}

/* THANH TRẠNG THÁI */
.statusbar {
    position: absolute;
    top: 0;
    width: 100%;
    height: 42px;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    z-index: 5;
    font-size: 13px;
}

/* MÀN HÌNH HOME */
.home {
    width: 100%;
    height: 100%;
    padding: 70px 20px 80px;
    background: linear-gradient(150deg, #16213e, #0f3460);
}

.clock {
    text-align: center;
    font-size: 45px;
    margin-bottom: 45px;
}

.apps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px 12px;
}

.app {
    text-align: center;
    cursor: pointer;
}

.app-icon {
    width: 60px;
    height: 60px;
    margin: auto;
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    background: white;
    color: black;
}

.app-name {
    margin-top: 7px;
    font-size: 12px;
}

    padding: 0 15px;

}
